[unix_http_server]
file=/run/easytier-bootstrap/supervisor.sock
chmod=0700
[supervisord]
logfile=/var/log/easytier-bootstrap/supervisor.log
pidfile=/run/easytier-bootstrap/supervisor.pid
childlogdir=/var/log/easytier-bootstrap
umask=0077
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/easytier-bootstrap/supervisor.sock
[program:easytier]
command=/usr/local/bin/easytier-core -c /etc/easytier-bootstrap/config.toml --rpc-portal 127.0.0.1:15888
user=root
autostart=false
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/easytier-bootstrap/core.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
